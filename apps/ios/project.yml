name: Ultimate Finance
options:
  bundleIdPrefix: io.ultimatefinance
  createIntermediateGroups: true
deploymentTarget:
  iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.10"
    TARGETED_DEVICE_FAMILY: "1,2"
    CODE_SIGN_STYLE: Automatic
targets:
  UltimateFinance:
    type: application
    platform: iOS
    sources:
      - Sources
    info:
      path: Info.plist
      properties:
        UILaunchScreen: {}
        CFBundleDisplayName: Ultimate Finance
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # Dev-only: the API currently serves plain HTTP on the LAN.
        # Remove NSAllowsArbitraryLoads when TLS lands.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
